[project]
name = "logistream-orchestrator"
version = "0.1.0"
description = "LogiStream orchestrator: LangGraph session graph, evaluator, Socratic tutors"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "psycopg[binary,pool]",
    "openai",
    "httpx",
    "pydantic",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
